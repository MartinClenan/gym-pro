<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importar Socios</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;
    --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
    --text:#f0f0f0;--text2:#888;--text3:#555;
    --accent:#c8f04a;--accent-dim:rgba(200,240,74,0.12);--accent-text:#0f0f0f;
    --red:#ff5555;--red-dim:rgba(255,85,85,0.12);
    --amber:#f4a94a;--amber-dim:rgba(244,169,74,0.12);
    --green:#4acf7f;--green-dim:rgba(74,207,127,0.12);
    --radius:10px;--radius-lg:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem;font-size:14px;}
  h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent);margin-bottom:0.25rem;}
  .sub{color:var(--text3);font-size:13px;margin-bottom:1.5rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem;}
  .card h2{font-size:14px;font-weight:600;margin-bottom:1rem;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem;}
  .stat{background:var(--surface2);border-radius:var(--radius);padding:12px;text-align:center;}
  .stat-num{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;}
  .stat-label{font-size:11px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;}
  .btn-primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600;}
  .btn-primary:hover{background:#d4f55c;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-danger{background:var(--red-dim);color:var(--red);border-color:transparent;}
  .row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .row:last-child{border-bottom:none;}
  .badge{border-radius:99px;padding:2px 10px;font-size:11px;font-weight:500;}
  .badge-new{background:var(--accent-dim);color:var(--accent);}
  .badge-exists{background:var(--amber-dim);color:var(--amber);}
  .badge-pago{background:var(--green-dim);color:var(--green);}
  .badge-plan{background:var(--surface2);color:var(--text2);}
  .name{flex:1;font-weight:500;}
  .spinner{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .progress{background:var(--surface2);border-radius:99px;height:6px;margin:10px 0;}
  .progress-bar{background:var(--accent);height:6px;border-radius:99px;transition:width 0.3s;}
  .log{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px;max-height:200px;overflow-y:auto;font-size:12px;color:var(--text2);margin-top:10px;}
  .log-line{padding:2px 0;border-bottom:1px solid var(--border);}
  .log-ok{color:var(--green);}
  .log-warn{color:var(--amber);}
  .log-err{color:var(--red);}
  .checkbox{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .section-title{font-size:13px;font-weight:600;color:var(--text2);margin:1rem 0 0.5rem;text-transform:uppercase;letter-spacing:0.5px;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:1rem;}
</style>
</head>
<body>

<h1>Importar Socios</h1>
<div class="sub">Verificando lista contra Airtable...</div>

<div class="stats">
  <div class="stat"><div class="stat-num" id="cnt-total" style="color:var(--text)">28</div><div class="stat-label">Total</div></div>
  <div class="stat"><div class="stat-num" id="cnt-new" style="color:var(--accent)">—</div><div class="stat-label">Nuevos</div></div>
  <div class="stat"><div class="stat-num" id="cnt-exist" style="color:var(--amber)">—</div><div class="stat-label">Ya existen</div></div>
</div>

<div id="loading-area" class="card" style="text-align:center;padding:2rem;">
  <div class="spinner"></div>
  <div style="margin-top:10px;color:var(--text3)">Consultando Airtable...</div>
</div>

<div id="result-area" style="display:none;">
  <div class="card">
    <h2>Nuevos — se van a agregar</h2>
    <div id="list-new"></div>
  </div>
  <div class="card" id="card-exists" style="display:none;">
    <h2>Ya existen en el sistema</h2>
    <div id="list-exists"></div>
  </div>
  <div class="actions">
    <button class="btn btn-primary" id="btn-importar" onclick="importar()">⬆ Importar nuevos</button>
    <button class="btn" onclick="location.reload()">↺ Volver a verificar</button>
  </div>
  <div class="progress" id="progress-wrap" style="display:none;">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
  <div class="log" id="log" style="display:none;"></div>
</div>

<script>
const API_KEY = 'patBZlyKEB8GuRLpG.ef1d684e17de16f8192bb6b43368ed8859b6286d2996ed4ebe19d025883b8d92';
const BASE    = 'appvBGUGQgezRFnaE';
const T_SOC   = 'tblp50VDdK0zxIPJw';
const T_PAG   = 'tbly47mIaBng11MWv';
const F = {
  nombre:'fldO2XwQh7A5bBqrO', apellido:'fldLNjb5fY536YVm0',
  suscrip:'fld0HKebUp10WKauz', precio:'fldQ9DGK5t34bZHhK',
  fecha:'fld3TIMcKePMZrZMV', notas:'fldfM1mVnfQ4hfjyd',
};
const FP = {
  socioId:'fldV69XPWzXcbNIr2', monto:'fldWBqI5IJUDRcgoo',
  fechaPago:'fldHtvbpqMHUnOD62', vencNuevo:'fldAXcfD2ksP7Ds8x',
  periodo:'fldGWgO8aGvOYFaMp',
};

// Lista a importar
const LISTA = [
  {n:'Jaqueline',a:'Dusso',     inicio:'2026-08-01',plan:'Mes', pago:true},
  {n:'Mariela',  a:'Buffoni',   inicio:'2026-08-01',plan:'Mes', pago:true},
  {n:'Jaqueline',a:'Gómez',     inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Erika',    a:'Gómez',     inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Hada',     a:'Vega',      inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Guillermina',a:'Galliano',inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Flor',     a:'Balda',     inicio:'2026-08-03',plan:'Mes', pago:true},
  {n:'Flor',     a:'Banegas',   inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Hada',     a:'VM',        inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Agustina Belén',a:'Ponce',inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Abril',    a:'Errapan',   inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Martin',   a:'Rodríguez', inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Marcelo',  a:'',          inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Benjamín', a:'Basile',    inicio:'2026-08-03',plan:'Mes', pago:true},
  {n:'Manuel',   a:'Alonso',    inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Sofia',    a:'Russo',     inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Fiama',    a:'Ponce',     inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Yesica',   a:'Melion',    inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'José',     a:'Vega',      inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Anabela',  a:'Monserrat', inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Diego',    a:'Gaute',     inicio:'2026-08-03',plan:'Mes', pago:true},
  {n:'Sofia',    a:'Redondo',   inicio:'2026-08-03',plan:'Día', pago:true},
  {n:'Ramon',    a:'Román',     inicio:'2026-08-03',plan:'Mes', pago:true},
  {n:'Carlos Alexis',a:'Villalba',inicio:'2026-08-03',plan:'Mes',pago:true},
  {n:'Alejandro',a:'Melliu',    inicio:'2026-08-03',plan:'Mes', pago:true},
  {n:'José',     a:'Catalán',   inicio:'2026-08-03',plan:'Mes', pago:true},
  {n:'José',     a:'Capote',    inicio:'2026-08-03',plan:'Mes', pago:false},
  {n:'Tomas',    a:'Carranza',  inicio:'2026-08-03',plan:'Mes', pago:true},
];

const PLAN_DIAS = {'Mes':30,'Día':1,'Semana':7};
const addDias = (f,d) => { const dt=new Date(f); dt.setDate(dt.getDate()+d); return dt.toISOString().slice(0,10); };
const fmtDate = d => { if(!d)return'-'; const p=d.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; };
const PRECIO_DEFAULT = 30000;

let nuevos=[], existentes=[];

async function api(path,method='GET',body=null){
  const opts={method,headers:{'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch('https://api.airtable.com/v0/'+BASE+'/'+path,opts);
  if(!res.ok) throw new Error('Error '+res.status);
  return res.json();
}

async function fetchAll(tableId){
  let all=[],offset=null;
  do{
    let url=tableId+'?pageSize=100';
    if(offset)url+='&offset='+encodeURIComponent(offset);
    const d=await api(url);
    all=all.concat(d.records||[]);
    offset=d.offset||null;
  }while(offset);
  return all;
}

function normName(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }

async function verificar(){
  try{
    const existentes_raw = await fetchAll(T_SOC);
    // Construir mapa de nombres existentes
    const mapaExistentes = {};
    existentes_raw.forEach(r => {
      const nom = normName((r.fields?.Nombre||r.fields?.['fldO2XwQh7A5bBqrO']||'') + ' ' + (r.fields?.Apellido||r.fields?.['fldLNjb5fY536YVm0']||''));
      mapaExistentes[nom] = r.id;
    });

    LISTA.forEach(s => {
      const fullName = normName(`${s.n} ${s.a}`);
      if(mapaExistentes[fullName]){
        existentes.push({...s, recordId: mapaExistentes[fullName]});
      } else {
        nuevos.push(s);
      }
    });

    document.getElementById('cnt-new').textContent   = nuevos.length;
    document.getElementById('cnt-exist').textContent = existentes.length;
    document.getElementById('loading-area').style.display='none';
    document.getElementById('result-area').style.display='block';

    // Mostrar nuevos
    document.getElementById('list-new').innerHTML = nuevos.map((s,i) => `
      <div class="row">
        <input type="checkbox" class="checkbox" id="chk-${i}" checked>
        <span class="name">${s.n} ${s.a}</span>
        <span class="badge badge-plan">${s.plan}</span>
        ${s.pago?'<span class="badge badge-pago">Pagó</span>':''}
        <span style="color:var(--text3);font-size:12px">${fmtDate(s.inicio)}</span>
      </div>`).join('');

    // Mostrar existentes
    if(existentes.length){
      document.getElementById('card-exists').style.display='block';
      document.getElementById('list-exists').innerHTML = existentes.map(s => `
        <div class="row">
          <span class="name">${s.n} ${s.a}</span>
          <span class="badge badge-exists">Ya existe</span>
          <span class="badge badge-plan">${s.plan}</span>
          ${s.pago?'<span class="badge badge-pago">Pagó</span>':''}
        </div>`).join('');
    }

  }catch(e){
    document.getElementById('loading-area').innerHTML = `<div style="color:var(--red)">Error al conectar con Airtable: ${e.message}</div>`;
  }
}

function log(msg, tipo=''){
  const el=document.getElementById('log');
  el.style.display='block';
  el.innerHTML+=`<div class="log-line ${tipo?'log-'+tipo:''}">${msg}</div>`;
  el.scrollTop=el.scrollHeight;
}

async function importar(){
  const btn=document.getElementById('btn-importar');
  btn.disabled=true; btn.textContent='Importando...';
  document.getElementById('progress-wrap').style.display='block';

  // Filtrar solo los tildados
  const aImportar = nuevos.filter((_,i)=>document.getElementById('chk-'+i)?.checked);
  let ok=0, errores=0;

  for(let i=0; i<aImportar.length; i++){
    const s = aImportar[i];
    const pct = Math.round((i/aImportar.length)*100);
    document.getElementById('progress-bar').style.width=pct+'%';

    try{
      const venc = addDias(s.inicio, PLAN_DIAS[s.plan]||30);
      // Crear socio
      const dr = await api(T_SOC,'POST',{records:[{fields:{
        [F.nombre]: s.n,
        [F.apellido]: s.a,
        [F.suscrip]: s.plan,
        [F.precio]: PRECIO_DEFAULT,
        [F.fecha]: venc,
      }}]});
      const socioId = dr.records[0].id;
      log(`✓ ${s.n} ${s.a} creado`, 'ok');

      // Si pagó, registrar pago
      if(s.pago){
        const periodo = s.inicio+' al '+venc;
        await api(T_PAG,'POST',{records:[{fields:{
          [FP.socioId]: socioId,
          [FP.monto]: PRECIO_DEFAULT,
          [FP.fechaPago]: s.inicio,
          [FP.vencNuevo]: venc,
          [FP.periodo]: periodo,
        }}]});
        log(`  💰 Pago registrado`, 'ok');
      }
      ok++;
    }catch(e){
      log(`✗ Error con ${s.n} ${s.a}: ${e.message}`, 'err');
      errores++;
    }

    // Pausa para no saturar la API
    await new Promise(r=>setTimeout(r,200));
  }

  document.getElementById('progress-bar').style.width='100%';
  log(`\n✅ Importación completa: ${ok} agregados, ${errores} errores`, ok>0?'ok':'err');
  btn.textContent='✅ Listo';
}

verificar();
</script>
</body>
</html>
